name: Gerar BOX GAME BRIDGE JAR

on:
  push:
    branches: [main]
    paths:
      - "PC/BoxGameBridge.java"
      - ".github/workflows/gerar-jar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar e criar JAR executavel
        run: |
          mkdir -p build
          javac -encoding UTF-8 -d build PC/BoxGameBridge.java
          jar --create --file PC/BoxGameBridge.jar --main-class BoxGameBridge -C build .

      - name: Salvar JAR na pasta PC do repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PC/BoxGameBridge.jar
          if ! git diff --cached --quiet; then
            git commit -m "Adiciona aplicativo BoxGameBridge.jar"
            git push
          fi

      - name: Disponibilizar tambem para download
        uses: actions/upload-artifact@v4
        with:
          name: BoxGameBridge
          path: PC/BoxGameBridge.jar
          if-no-files-found: error
          retention-days: 30
